thresholds:
  sizemin: 50
  sizemax: 50000
  refdist: 2000
  chunksize: 5000
  pctseq: 0.7
  pctsize: 0.7
  pick: ac
  pass_only: true
  refine: true
sv:
  enabled: true
  overwrite: false
  sawfish:
    enabled: true
    executable: sawfish
    threads: 4
    memory_mb: 32000
    runtime_minutes: 1440
    disable_cnv: false
