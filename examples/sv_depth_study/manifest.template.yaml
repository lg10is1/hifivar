    executable: sniffles
    threads: 4
    memory_mb: 16000
    runtime_minutes: 720
    minimum_support: null
    minimum_sv_length: 50
  pbsv:
    enabled: true
    executable: pbsv
    threads: 4
    memory_mb: 32000
    runtime_minutes: 1440
  cutesv:
    enabled: true
    executable: cuteSV
    threads: 4
    memory_mb: 16000
    runtime_minutes: 720
    minimum_support: 10
    minimum_sv_size: 30
    max_cluster_bias_ins: 1000
    diff_ratio_merging_ins: 0.9
    max_cluster_bias_del: 1000
    diff_ratio_merging_del: 0.5
    genotype: true
  finalization:
    bgzip_executable: bgzip
    tabix_executable: tabix
design:
