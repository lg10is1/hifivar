name: HiFiVar distribution smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build core image
        run: docker build --pull -t hifivar:ci .
      - name: Verify version and config
        run: |
          docker run --rm hifivar:ci --version
          docker run --rm hifivar:ci config validate
      - name: Verify non-root runtime
        run: docker run --rm --entrypoint /usr/bin/id hifivar:ci -u

  source-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and audit public artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,workflow]'
          python -m build
          python scripts/audit_public_release.py . --artifacts-dir dist
          python -m pytest tests/integration/test_public_distribution.py tests/integration/test_phase14_package.py
