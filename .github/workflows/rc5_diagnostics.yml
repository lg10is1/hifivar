name: Record HiFiVar RC5 CI diagnosis

on:
  push:
    branches: [release/rc5-diagnostics]

permissions:
  actions: read
  contents: write

jobs:
  summaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Capture only failed synthetic-test names
        run: |
          printf '# RC5 validation diagnostics\n\n' > RC5_CI_DIAGNOSIS.md
          for job in 138947419462 138947419908; do
            printf '## CI job %s\n\n' "$job" >> RC5_CI_DIAGNOSIS.md
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$job" --jq '[.status,.conclusion] | join(" ")' >> RC5_CI_DIAGNOSIS.md
            if gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$job/logs" > "$RUNNER_TEMP/rc5-$job.txt"; then
              python - "$RUNNER_TEMP/rc5-$job.txt" <<'PY' >> RC5_CI_DIAGNOSIS.md
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors="replace")
          text = re.sub(r"\x1b\[[0-9;]*m", "", text)
          tests = sorted(set(re.findall(r"(?:FAILED|ERROR) (tests[/\\][a-zA-Z0-9_/\\.]+::[a-zA-Z0-9_]+)", text)))
          print(f"Log parsed ({len(text)} bytes).")
          for name in tests:
              print(f"- {name}")
          PY
            else
              printf 'Log download unavailable.\n' >> RC5_CI_DIAGNOSIS.md
            fi
            printf '\n' >> RC5_CI_DIAGNOSIS.md
          done
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            add RC5_CI_DIAGNOSIS.md
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Record isolated RC5 test identifiers"
          git push origin HEAD:refs/heads/release/rc5-diagnostics
