name: Diagnose HiFiVar Python 3.10 compatibility

on:
  push:
    branches: [release/rc5-diagnostics]

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  python310:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install the core test environment
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Reproduce Python 3.10 core test results
        run: python -m pytest tests/unit -q -p no:cacheprovider --tb=short --junitxml="$RUNNER_TEMP/rc5-tests.xml"
      - name: Record core test status and test names
        if: always()
        run: |
          python - "$RUNNER_TEMP/rc5-tests.xml" <<'PY' > RC5_CI_310.md
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          print("# Python 3.10 core test results")
          report = Path(sys.argv[1])
          if not report.is_file():
              print("\nThe test runner did not produce results.")
          else:
              tree = ET.parse(report)
              suite = tree.find(".//testsuite")
              print()
              for name in ("tests", "failures", "errors", "skipped"):
                  print(f"- {name}: {int(suite.attrib.get(name, '0'))}")
              for case in tree.findall(".//testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  name = re.sub(r"[^A-Za-z0-9_.]", "", case.attrib.get("classname", ""))
                  method = re.sub(r"[^A-Za-z0-9_.]", "", case.attrib.get("name", "").split("[", 1)[0])
                  print(f"- {name}::{method}")
          PY
          git add RC5_CI_310.md
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Record Python 3.10 test outcome"
          git push origin HEAD:refs/heads/release/rc5-diagnostics
