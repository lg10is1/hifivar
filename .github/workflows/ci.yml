name: HiFiVar lightweight CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development and workflow dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,workflow]"
      - name: Syntax and package build
        run: python -m compileall src && python -m build
      - name: Unit, fake-tool, CLI, package, and Snakemake smoke tests
        run: python -m pytest -p no:cacheprovider
      - name: Installed resource smoke
        run: python -c "from hifivar.package_resources import installed_workflow_root; assert installed_workflow_root().joinpath('Snakefile').is_file()"

# Real WGS data and heavyweight bioinformatics executables are intentionally
# excluded. Their versioned Linux/HPC validation remains a separate release gate.
